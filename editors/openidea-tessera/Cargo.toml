# Native workspace: the shared syntax crate and the language server.
# The OpenIDEA plugin component (`plugin/`) is its own workspace because it
# builds for wasm32-wasip2.
[workspace]
resolver = "2"
members = ["crates/tessera-syntax", "crates/tessera-lsp"]
exclude = ["plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
