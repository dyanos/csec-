[package]
name = "tessera-lsp"
description = "Language server for Tessera (.csec): diagnostics from csec++, symbols, navigation, completion, hover, semantic highlighting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tessera-lsp"
path = "src/main.rs"

[dependencies]
tessera-syntax = { path = "../tessera-syntax" }
lsp-server = "0.7"
lsp-types = "=0.95.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
