[package]
name = "openidea-plugin-tessera"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK of the IDE release the plugin targets (OpenIDEA 0.1.38, plugin API 1.x).
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.38" }
tessera-syntax = { path = "../crates/tessera-syntax" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
