id = "tessera"
name = "Tessera"
extensions = ["csec"]
line-comment = "//"
block-comment = ["/*", "*/"]
indent = { tab-size = 4, insert-spaces = true }
scratch-template = '''
def main(): Int {
    $END$
    return 0;
}
'''

# Build it from editors/openidea-tessera (cargo build --release -p tessera-lsp)
# and put target/release/tessera-lsp on PATH, or run scripts/build.ps1 -Install.
[[language-servers]]
name = "tessera-lsp"
command = "tessera-lsp"
root-markers = ["CMakeLists.txt", ".git"]
install-hint = "cargo install --path editors/openidea-tessera/crates/tessera-lsp (in the Tessera repository), then make sure ~/.cargo/bin is on PATH"

# Read by tessera-lsp (all optional). compilerPath: csec++ to run (found in
# <root>/x64/{Release,Debug}, <root>/build, $TESSERA_COMPILER or PATH when
# empty); compilerArgs: extra flags such as "--no-strict-ownership";
# checkMode: "full" (parse + type check) or "syntax".
[language-servers.initialization-options]
compilerArgs = []
checkMode = "full"
checkOnSave = true
checkOnOpen = true
checkTimeoutMs = 30000
